[package]
name = "netmon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
netmon-common = { path = "../netmon-common", features = ["user"] }
aya = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
procfs = { workspace = true }
libc = "0.2"
ratatui = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
serde_json = "1.0.154"
base64 = "0.22.1"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }

[[bin]]
name = "netmon"
path = "src/main.rs"

[[bin]]
name = "netmond"
path = "src/bin/netmond.rs"

[[bin]]
name = "netmon-notify"
path = "src/bin/netmon-notify.rs"
