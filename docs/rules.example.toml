# Example /etc/netmon/rules.toml for ask mode: system services that
# should never ask. Exe paths are those of Arch/Manjaro; check yours with
# `readlink /proc/$(pidof systemd-resolved)/exe`.
# Install: sudo install -o root -g root -m 0644 rules.example.toml /etc/netmon/rules.toml
default = "ask"

[[rule]]
action = "allow"
direction = "out"
process = "/usr/lib/systemd/systemd-resolved"
port = 53
comment = "DNS upstream"

[[rule]]
action = "allow"
direction = "out"
process = "/usr/lib/systemd/systemd-resolved"
proto = "tcp"
port = 853
comment = "DNS over TLS upstream"

[[rule]]
action = "allow"
direction = "out"
process = "/usr/lib/systemd/systemd-timesyncd"
proto = "udp"
port = 123
comment = "NTP"

[[rule]]
action = "allow"
direction = "out"
process = "/usr/bin/NetworkManager"
comment = "connectivity check, DHCP helpers"
