[package]
name = "netmon-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
user = ["dep:aya", "dep:serde"]

[dependencies]
aya = { workspace = true, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[lib]
path = "src/lib.rs"
